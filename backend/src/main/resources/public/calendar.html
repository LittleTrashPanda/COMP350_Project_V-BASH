<!DOCTYPE html>

<html lang = "en">

<head>
    <meta charset = "UTF-8">
    <link rel = "stylesheet" href = "calendar.css">
    <script src = "calendar.js"></script>
    <title>Search Page</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

    <h1>Calendar</h1>

    <a href = "index.html">Home</a>

    <input id = "saveScheduleName" placeholder = "Save Schedule by Name">
    <button id = "saveSchedule">Save</button>
<!--    <input id = "loadScheduleName" placeholder = "Load Schedule by Name">-->
    <label for="loadScheduleName">Choose yo name</label>
    <select name = "Names" id = "loadScheduleName">
    </select>

    <input type="text" id="newItemText" placeholder="New option text">
    <button onclick="addNewOption()">Add Option</button>
    <button id = "loadSchedule">Load</button>
    <button id = "clearSchedule">Clear Schedule</button>
    <button id ="generatePDF">Save as PDF</button>


    <div id = "pdf-save" class="pdf">
        <h1>Schedule</h1>
        <p id = "pdf-text">test</p>
    </div>



    <div id ="calendarContent" class = "calendarContentContainer">
        <div class = "timeMarkers">
            <p style = "top: calc(0/13 * 100% - 0.5vh); left: 5.5vw; opacity: 0.5;" class = "time"> 8:00</p>
            <div style = "top: calc( 0.5/13 * 100%);" class = "timeMarker"><p class = "time"> 8:30</p></div>
            <div style = "top: calc(   1/13 * 100%);" class = "timeMarker"><p class = "time"> 9:00</p></div>
            <div style = "top: calc( 1.5/13 * 100%);" class = "timeMarker"><p class = "time"> 9:30</p></div>
            <div style = "top: calc(   2/13 * 100%);" class = "timeMarker"><p class = "time">10:00</p></div>
            <div style = "top: calc( 2.5/13 * 100%);" class = "timeMarker"><p class = "time">10:30</p></div>
            <div style = "top: calc(   3/13 * 100%);" class = "timeMarker"><p class = "time">11:00</p></div>
            <div style = "top: calc( 3.5/13 * 100%);" class = "timeMarker"><p class = "time">11:30</p></div>
            <div style = "top: calc(   4/13 * 100%);" class = "timeMarker"><p class = "time">12:00</p></div>
            <div style = "top: calc( 4.5/13 * 100%);" class = "timeMarker"><p class = "time">12:30</p></div>
            <div style = "top: calc(   5/13 * 100%);" class = "timeMarker"><p class = "time"> 1:00</p></div>
            <div style = "top: calc( 5.5/13 * 100%);" class = "timeMarker"><p class = "time"> 1:30</p></div>
            <div style = "top: calc(   6/13 * 100%);" class = "timeMarker"><p class = "time"> 2:00</p></div>
            <div style = "top: calc( 6.5/13 * 100%);" class = "timeMarker"><p class = "time"> 2:30</p></div>
            <div style = "top: calc(   7/13 * 100%);" class = "timeMarker"><p class = "time"> 3:00</p></div>
            <div style = "top: calc( 7.5/13 * 100%);" class = "timeMarker"><p class = "time"> 3:30</p></div>
            <div style = "top: calc(   8/13 * 100%);" class = "timeMarker"><p class = "time"> 4:00</p></div>
            <div style = "top: calc( 8.5/13 * 100%);" class = "timeMarker"><p class = "time"> 4:30</p></div>
            <div style = "top: calc(   9/13 * 100%);" class = "timeMarker"><p class = "time"> 5:00</p></div>
            <div style = "top: calc( 9.5/13 * 100%);" class = "timeMarker"><p class = "time"> 5:30</p></div>
            <div style = "top: calc(  10/13 * 100%);" class = "timeMarker"><p class = "time"> 6:00</p></div>
            <div style = "top: calc(10.5/13 * 100%);" class = "timeMarker"><p class = "time"> 6:30</p></div>
            <div style = "top: calc(  11/13 * 100%);" class = "timeMarker"><p class = "time"> 7:00</p></div>
            <div style = "top: calc(11.5/13 * 100%);" class = "timeMarker"><p class = "time"> 7:30</p></div>
            <div style = "top: calc(  12/13 * 100%);" class = "timeMarker"><p class = "time"> 8:00</p></div>
            <div style = "top: calc(12.5/13 * 100%);" class = "timeMarker"><p class = "time"> 8:30</p></div>
        </div>
        <ul id = "calendar" class = "calendar">
            <li class = "calendarDay"><p class = "dayTitle"><b>Monday</b></p><div class = "dayCourseTimeTable"></div></li>
            <li class = "calendarDay"><p class = "dayTitle"><b>Tuesday</b></p><div class = "dayCourseTimeTable"></div></li>
            <li class = "calendarDay"><p class = "dayTitle"><b>Wednesday</b></p><div class = "dayCourseTimeTable"></div></li>
            <li class = "calendarDay"><p class = "dayTitle"><b>Thursday</b></p><div class = "dayCourseTimeTable"></div></li>
            <li class = "calendarDay"><p class = "dayTitle"><b>Friday</b></p><div class = "dayCourseTimeTable"></div></li>
        </ul>
    </div>

</body>
</html>
